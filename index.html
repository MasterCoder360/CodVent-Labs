<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeVent Labs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="canonical" href="https://cosmospark.org" />
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">View More</a>
                <a href="#" class="nav-link">Our Goal</a>
            </div>

            <div class="logo">
                <img src="navlogo.png" alt="CodeVent Labs" class="logo-default" id="logoDefault">
                <img src="navlogo2.png" alt="CodeVent Labs" class="logo-scrolled" id="logoScrolled">
            </div>

            <div class="nav-right">
                <button class="icon-btn" aria-label="Account">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <div class="cart-wrapper">
                    <button class="icon-btn" aria-label="Cart">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </button>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>
        <div class="intro-section" id="introSection">
        <video id="introVideo" autoplay muted loop playsinline>
            <source src="intro.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="intro-overlay">
            <button class="unmute-btn" id="unmuteBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
                <span>UNMUTE</span>
            </button>

            <div class="intro-content">
                <h1 class="intro-title">
                    <span class="highlight">Create</span> Like An Engineer
                </h1>
                <p class="intro-subtitle">
                    Create your invention. Code your page. Learn engineering!
                </p>
                <button class="cta-btn" id="ctaBtn">GET STARTED</button>
            </div>
        </div>
    </div>

    <div class="content">
        <h1>Welcome to CodeVent Labs</h1>
        <p>Whatever it is, learning code, science experiment ideas, or just engineering facts, you came to the right place!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
