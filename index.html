<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeVent Labs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">View More</a>
                <a href="#" class="nav-link">Our Goal</a>
            </div>

            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="#E63946" stroke="#E63946" stroke-width="2"/>
                    <path d="M12 20C12 15.5817 15.5817 12 20 12C22.5 12 24.7 13.2 26.1 15.1" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    <path d="M28 20C28 24.4183 24.4183 28 20 28C17.5 28 15.3 26.8 13.9 24.9" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">CodeVent Labs</span>
            </div>
            <div class="nav-right">
                <button class="icon-btn" aria-label="Account">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <div class="cart-wrapper">
                    <button class="icon-btn" aria-label="Cart">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </button>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="content">
        <h1>Scroll down to see the effect</h1>
        <p>As you scroll down the page, the navigation bar will transform by becoming rounded with a blue background. This Is the first phase of my development project.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
