<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeVent Labs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 200vh; 
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 40px;
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            background-color: #0066CC;
            border-radius: 50px;
            padding: 15px 40px;
            margin: 10px;
            right: 10px;
            left: 10px;
            width: calc(100% - 20px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: #333;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #0066CC;
        }

        .navbar.scrolled .nav-link {
            color: white;
        }

        .navbar.scrolled .nav-link:hover {
            color: #E0F0FF;
        }

    
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #0066CC;
            letter-spacing: -0.5px;
        }

        .navbar.scrolled .logo-text {
            color: white;
        }

    
        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #333;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .navbar.scrolled .icon-btn svg {
            stroke: white;
        }

        .cart-count {
            position: absolute;
            bottom: 18px;
            right: 18px;
            background-color: #FF6B6B;
            color: white;
            font-size: 10px;
            font-weight: 600;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-wrapper {
            position: relative;
        }

        .content {
            padding-top: 100px;
            padding-left: 40px;
            padding-right: 40px;
        }

        .content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #333;
        }

        .content p {
            font-size: 18px;
            line-height: 1.6;
            color: #666;
            max-width: 800px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-left {
                gap: 15px;
            }

            .nav-link {
                font-size: 12px;
            }

            .logo-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">View More</a>
                <a href="#" class="nav-link">Our Goal</a>
            </div>

            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="#E63946" stroke="#E63946" stroke-width="2"/>
                    <path d="M12 20C12 15.5817 15.5817 12 20 12C22.5 12 24.7 13.2 26.1 15.1" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    <path d="M28 20C28 24.4183 24.4183 28 20 28C17.5 28 15.3 26.8 13.9 24.9" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">CodeVent Labs</span>
            </div>
            <div class="nav-right">
                <button class="icon-btn" aria-label="Account">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <div class="cart-wrapper">
                    <button class="icon-btn" aria-label="Cart">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </button>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="content">
        <h1>Scroll down to see the effect</h1>
        <p>As you scroll down the page, the navigation bar will transform - becoming rounded with a blue background. This Is the first phase of my development project.</p>
    </div>

    <script>
        const navbar = document.getElementById('navbar');
        
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        let cartCount = 0;
        const cartCountElement = document.querySelector('.cart-count');
        
        function updateCartCount(newCount) {
            cartCount = newCount;
            cartCountElement.textContent = cartCount;
        }
        function addToCart() {
            updateCartCount(cartCount + 1);
        }
    </script>
</body>
</html>
