<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeVent Labs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">View More</a>
                <a href="#" class="nav-link">Our Goal</a>
            </div>

            <div class="logo">
                <img src="navlogo.png" alt="CodeVent Labs" class="logo-default" id="logoDefault">
                <img src="navlogo2.png" alt="CodeVent Labs" class="logo-scrolled" id="logoScrolled">
            </div>

            <div class="nav-right">
                <button class="icon-btn" aria-label="Account">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <div class="cart-wrapper">
                    <button class="icon-btn" aria-label="Cart">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </button>
                    <span class="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="content">
        <h1>Scroll down to see the effect</h1>
        <p>As you scroll down the page, the navigation bar will transform by becoming rounded with a blue background. The logo will also change from white to the blue CodeVent Labs version.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
